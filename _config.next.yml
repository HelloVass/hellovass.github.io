# NexT Theme Configuration
# See: https://theme-next.js.org/docs/getting-started/configuration

# Scheme
scheme: Mist

# Dark Mode
darkmode: true

# Custom file path - enable variable and style overrides
custom_file_path:
  head: source/_data/head.njk
  postBodyEnd: source/_data/post-body-end.njk
  variable: source/_data/variables.styl
  style: source/_data/styles.styl

# Menu
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th

menu_settings:
  icons: true
  badges: true

# Sidebar
sidebar:
  position: left
  display: post

avatar:
  url: https://github.com/hellovass.png
  rounded: true
  rotated: false

social:
  GitHub: https://github.com/hellovass || fab fa-github

social_icons:
  enable: true
  icons_only: false

# Table of Contents
toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 6

# Footer
footer:
  since: 2026
  powered: true

# Post
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# Code block
codeblock:
  copy_button:
    enable: true
    style: mac
  fold:
    enable: true
    height: 500
  language: true

# Back to top
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Reading progress bar
reading_progress:
  enable: true
  position: top
  color: "#7F52FF"
  height: 3px

# Medium Zoom for image lightbox
mediumzoom: true

# Font
font:
  enable: true
  host: https://fonts.googleapis.com
  global:
    external: true
    family: Noto Sans SC
    size:
  title:
    external: true
    family:
    size:
  headings:
    external: true
    family:
    size:
  posts:
    external: true
    family:
  codes:
    external: true
    family: Fira Code

# Preconnect for fonts CDN
preconnect: true

# Word counter
symbols_count_time:
  separated_meta: true
  item_text_total: false

# Local search
local_search:
  enable: true
  top_n_per_article: 3
  unescape: false
  preload: false

# Reward (打赏) - 使用自定义实现，关闭 NexT 内置
reward_settings:
  enable: false

# Creative Commons (版权许可)
creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: true
  language: deed.zh

# Comments - Utterances
comments:
  active: utterances
  lazyload: true

utterances:
  enable: true
  repo: HelloVass/hellovass.github.io
  issue_term: pathname
  theme: github-light

# MathJax
math:
  every_page: false
  mathjax:
    enable: true
    tags: ams
